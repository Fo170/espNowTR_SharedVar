; ============================================================================
;  Exemple ESP8266 — espNow_SharedVariable (PlatformIO)
;  Compilation :  pio run    (depuis ce dossier)
; ============================================================================

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; active la librairie + logs Serial (déclaration/jeton/envoi/réception/CRC)
build_flags = -D_ESP_NOW_SHARED_VARIABLE_ -D_DEBUG_ESP_NOW_SHARED_VARIABLE_

; La librairie (src/espNow_SharedVariable.h + library.json) est à la RACINE du
; dépôt, deux dossiers au-dessus (exemples/exemple_ESP8266 -> racine).
lib_deps = ../..

; Une fois publiée sur GitHub (convention Fo170 : TOUJOURS la forme git
; complète, jamais "lib_deps = Fo170/espNow_SharedVariable") :
; lib_deps = https://github.com/Fo170/espNow_SharedVariable.git
