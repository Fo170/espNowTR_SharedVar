; ============================================================================
;  Exemple ESP32 — espNowTR_SharedVar (PlatformIO)
;  Compilation :  pio run    (depuis ce dossier)
; ============================================================================

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; active la librairie + logs Serial (déclaration/jeton/envoi/réception/CRC)
build_flags = -D_ESP_NOW_TR_SHARED_VAR_ -D_DEBUG_ESP_NOW_TR_SHARED_VAR_

; La librairie (src/espNowTR_SharedVar.h + library.json) est à la RACINE du
; dépôt, deux dossiers au-dessus (exemples/exemple_ESP32 -> racine).
lib_deps = ../..

; Une fois publiée sur GitHub (convention Fo170 : TOUJOURS la forme git
; complète, jamais "lib_deps = Fo170/espNowTR_SharedVar") :
; lib_deps = https://github.com/Fo170/espNowTR_SharedVar.git
